apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('keystore.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def releaseSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def releaseSigningConfigured = releaseSigningKeys.every { signingProperties.getProperty(it)?.trim() }
if (signingPropertiesFile.exists() && !releaseSigningConfigured) {
    throw new GradleException('keystore.properties must define storeFile, storePassword, keyAlias, and keyPassword.')
}

def buildConfigString = { value ->
    "\"${value.replace('\\', '\\\\').replace('\"', '\\\"')}\""
}
def debugApiBaseUrl = providers.gradleProperty('WRITON_DEBUG_API_BASE_URL')
    .orElse('https://writon-powerup.onrender.com/')
    .get()
def releaseApiBaseUrl = providers.gradleProperty('WRITON_RELEASE_API_BASE_URL')
    .orElse('https://writon-powerup.onrender.com/')
    .get()

configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion "2.0.21"
        }
    }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

android {
    namespace "com.ibitvalley.writon"

    compileSdk 35

    defaultConfig {
        applicationId "com.ibitvalley.writon"
        minSdk 23
        targetSdk 35
        versionCode 100
        versionName '2.0.0'
        vectorDrawables.useSupportLibrary = true

        ksp {
            arg("room.queryVerification", "false")
            arg("room.incremental", "true")
            arg("room.expandProjection", "true")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    kotlin {
        jvmToolchain(17)
    }

    buildFeatures {
        compose true
        buildConfig true
        viewBinding false
        dataBinding false
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
                storeFile rootProject.file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE_URL', buildConfigString(debugApiBaseUrl)
            manifestPlaceholders.usesCleartextTraffic = true
        }
        release {
            buildConfigField 'String', 'API_BASE_URL', buildConfigString(releaseApiBaseUrl)
            manifestPlaceholders.usesCleartextTraffic = false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    // Kotlin & Coroutines
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0"

    // Jetpack Compose (BOM-managed)
    def compose_bom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation compose_bom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Compose Integration & Navigation
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.navigation:navigation-compose:2.8.7'
    implementation 'androidx.navigation:navigation-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    // Legacy XML screens still reference AppCompat and Material XML themes.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Room Database
    def roomVersion = "2.6.1"
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // DataStore Preferences
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // WorkManager Background Sync
    implementation 'androidx.work:work-runtime-ktx:2.10.0'

    // Async Image Loading
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Retrofit & OkHttp Networking
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Google Play Auth
    implementation 'com.google.android.gms:play-services-auth:21.3.0'

    // Firebase Suite (BOM-managed)
    implementation platform('com.google.firebase:firebase-bom:33.10.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-config'

    // Unit Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
}
