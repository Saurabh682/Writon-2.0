apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.firebase.firebase-perf'

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('keystore.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def releaseSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def releaseSigningEnvironmentNames = [
    storeFile: 'WRITON_RELEASE_STORE_FILE',
    storePassword: 'WRITON_RELEASE_STORE_PASSWORD',
    keyAlias: 'WRITON_RELEASE_KEY_ALIAS',
    keyPassword: 'WRITON_RELEASE_KEY_PASSWORD',
]
def releaseSigningValues = releaseSigningKeys.collectEntries { key ->
    def fromFile = signingProperties.getProperty(key)?.trim()
    def fromEnvironment = System.getenv(releaseSigningEnvironmentNames[key])?.trim()
    [(key): fromEnvironment ?: fromFile]
}
def releaseSigningConfigured = releaseSigningKeys.every { releaseSigningValues[it] }
// Public certificate fingerprint for the upload key that signs WritOn release artifacts.
// Google Sign-In requires a matching Android OAuth client in google-services.json.
def releaseGoogleSignInSha1 = '663c9171d757475f8f94ab1c0826ad38f145c60f'
if (signingPropertiesFile.exists() && !releaseSigningConfigured) {
    throw new GradleException('keystore.properties must define storeFile, storePassword, keyAlias, and keyPassword.')
}

def buildConfigString = { value ->
    "\"${value.replace('\\', '\\\\').replace('\"', '\\\"')}\""
}
def debugApiBaseUrl = providers.gradleProperty('WRITON_DEBUG_API_BASE_URL')
    .orElse('https://api.writon.cc/')
    .get()
def releaseApiBaseUrl = providers.gradleProperty('WRITON_RELEASE_API_BASE_URL')
    .orElse('https://api.writon.cc/')
    .get()

configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion "2.0.21"
        }
    }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

android {
    namespace "com.ibitvalley.writon"

    compileSdk 36

    defaultConfig {
        applicationId "com.ibitvalley.writon"
        minSdk 23
        targetSdk 36
        // Each Google Play upload needs a unique, monotonically increasing code.
        versionCode 116
        versionName '2.0.14'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
            arg("room.queryVerification", "false")
            arg("room.incremental", "true")
            arg("room.expandProjection", "true")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    kotlin {
        jvmToolchain(17)
    }

    buildFeatures {
        compose true
        buildConfig true
        viewBinding false
        dataBinding false
    }

    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (releaseSigningConfigured) {
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
                storeFile rootProject.file(releaseSigningValues.storeFile)
                storePassword releaseSigningValues.storePassword
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE_URL', buildConfigString(debugApiBaseUrl)
            manifestPlaceholders.usesCleartextTraffic = true
            signingConfig signingConfigs.debug
        }
        release {
            buildConfigField 'String', 'API_BASE_URL', buildConfigString(releaseApiBaseUrl)
            manifestPlaceholders.usesCleartextTraffic = false
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def needsReleaseSigning = taskGraph.allTasks.any { task ->
        task.name.toLowerCase().contains('release') &&
            (task.name.toLowerCase().contains('assemble') || task.name.toLowerCase().contains('bundle'))
    }
    if (needsReleaseSigning && !releaseSigningConfigured) {
        throw new GradleException('Release signing is not configured. Create an untracked keystore.properties with storeFile, storePassword, keyAlias, and keyPassword.')
    }
}

tasks.register('verifyReleaseGoogleSignInConfig') {
    group = 'verification'
    description = 'Fails release builds when google-services.json lacks the release Android OAuth client.'

    doLast {
        def googleServicesFile = file('google-services.json')
        if (!googleServicesFile.exists()) {
            throw new GradleException('app/google-services.json is missing. Download it from Firebase before building a release.')
        }

        def googleServices = new groovy.json.JsonSlurper().parse(googleServicesFile)
        def configuredHashes = (googleServices.client ?: []).collectMany { client ->
            (client.oauth_client ?: []).findAll { oauthClient ->
                oauthClient.client_type == 1 && oauthClient.android_info?.package_name == android.namespace
            }.collect { oauthClient ->
                oauthClient.android_info?.certificate_hash?.toString()?.replace(':', '')?.toLowerCase()
            }
        }.findAll { it }

        if (!configuredHashes.contains(releaseGoogleSignInSha1)) {
            throw new GradleException(
                'Release Google Sign-In is not configured. Create an Android OAuth client for ' +
                    android.namespace + ' with SHA-1 66:3C:91:71:D7:57:47:5F:8F:94:AB:1C:08:26:AD:38:F1:45:C6:0F, ' +
                    'then download a fresh app/google-services.json from Firebase.'
            )
        }
    }
}

tasks.matching { it.name == 'processReleaseGoogleServices' }.configureEach {
    dependsOn tasks.named('verifyReleaseGoogleSignInConfig')
}

dependencies {
    // Kotlin & Coroutines
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0"

    // Jetpack Compose (BOM-managed)
    def compose_bom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation compose_bom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Compose Integration & Navigation
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.navigation:navigation-compose:2.8.7'
    implementation 'androidx.navigation:navigation-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    // Legacy XML screens still reference AppCompat and Material XML themes.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Room Database
    def roomVersion = "2.6.1"
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // DataStore Preferences
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // WorkManager Background Sync
    implementation 'androidx.work:work-runtime-ktx:2.10.0'

    // Async Image Loading
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Retrofit & OkHttp Networking
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Google Play Auth & Biometrics
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'androidx.biometric:biometric:1.1.0'

    // Firebase Suite (BOM-managed)
    implementation platform('com.google.firebase:firebase-bom:33.10.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-perf'

    // Unit Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core-ktx:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "androidx.room:room-testing:$roomVersion"
    androidTestImplementation compose_bom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
