name: WritOn 2.0 CI

on:
  push:
    branches: [ main, master, Till_29Aug ]
  pull_request:
    branches: [ main, master, Till_29Aug ]

jobs:
  backend-test:
    name: Backend Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Fastify Contract Tests
        working-directory: ./server
        run: npm test

  web-build:
    name: Web App Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Web Application
        working-directory: ./web
        run: npm run build

  android-verify:
    name: Android Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper
        run: ./gradlew --version
