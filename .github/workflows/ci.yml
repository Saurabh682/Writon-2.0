name: WritOn 2.0 CI

on:
  push:
    branches: [ main, master, Till_29Aug ]
  pull_request:
    branches: [ main, master, Till_29Aug ]

jobs:
  backend-test:
    name: Backend Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Fastify Contract Tests
        working-directory: ./server
        run: npm test

  web-build:
    name: Web App Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Run Web Contract Tests
        working-directory: ./web
        run: npm test

      - name: Build Web Application
        working-directory: ./web
        run: npm run build

  android-verify:
    name: Android Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not configured. Using CI fallback google-services.json."
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "1776715124",
                "project_id": "writon-app-2020",
                "storage_bucket": "writon-app-2020.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:1776715124:android:mockci123456",
                    "android_client_info": {
                      "package_name": "com.ibitvalley.writon"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "AIzaSyMockKeyForCIValidation12345"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "other_platform_oauth_client": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }
            EOF
          fi

      - name: Run Android tests, lint, and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

  android-device-test:
    name: Android Emulator Journeys
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "1776715124",
                "project_id": "writon-app-2020",
                "storage_bucket": "writon-app-2020.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:1776715124:android:mockci123456",
                    "android_client_info": {
                      "package_name": "com.ibitvalley.writon"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "AIzaSyMockKeyForCIValidation12345"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "other_platform_oauth_client": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }
            EOF
          fi

      - name: Run critical journeys on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

