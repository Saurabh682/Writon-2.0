<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WritOn Bridge</title>
  <style>
    :root {
      --ink: #2e241c;
      --muted: #6b5c4c;
      --accent: #c15b3a;
      --bg: #faf6ef;
      --card: #ffffff;
      --border: #e5dccb;
      --success: #2d6a4f;
      --danger: #a83232;
    }

    * { box-sizing: border-box; }

    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    header h1 {
      font-size: 15px;
      margin: 0 0 3px 0;
      color: var(--accent);
      letter-spacing: -0.01em;
    }

    .tagline {
      margin: 0 0 12px 0;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 11.5px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status-dot.active {
      background: var(--accent);
      box-shadow: 0 0 6px rgba(209, 82, 38, 0.6);
    }
    .status-dot.error { background: var(--danger); }

    .btn-main {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.2s;
    }

    .btn-main:hover { opacity: 0.9; }
    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-sub {
      width: 100%;
      background: var(--card);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 6px;
      font-size: 11.5px;
      cursor: pointer;
    }

    .btn-sub:hover { border-color: var(--accent); }

    #logBox {
      max-height: 90px;
      overflow-y: auto;
      font-size: 10.5px;
      color: var(--muted);
      line-height: 1.35;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 8px;
      padding: 6px;
      background: #f4ede2;
      border-radius: 4px;
      border: 1px solid #ebdccb;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>WritOn Browser Bridge</h1>
    <p class="tagline">Run draft critiques directly inside your active ChatGPT tab.</p>
  </header>

  <div class="card">
    <div class="status-row">
      <span id="dot" class="status-dot"></span>
      <strong id="serverStatus">Checking server...</strong>
    </div>
    <div id="queueText" style="color: var(--muted);">Checking queue...</div>
  </div>

  <button id="runBtn" class="btn-main">
    Run Critique on Active Tab
  </button>

  <button id="extractBtn" class="btn-main" style="background: #2d6a4f; margin-bottom: 8px;">
    Extract Current Output
  </button>

  <button id="openTabBtn" class="btn-sub">
    Open Critique Thread
  </button>

  <div id="logBox"></div>

  <script src="popup.js"></script>
</body>
</html>
