<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Redirecting to WritOn on Google Play...</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png?v=2" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2" />
  <meta name="robots" content="noindex, nofollow" />
  
  <style>
    :root {
      --bg: #FFFDF9;
      --card-bg: #F8F4EE;
      --text: #151718;
      --muted: #6D6963;
      --accent: #E75A2A;
      --border: #E8E2D9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131415;
        --card-bg: #1A1C1E;
        --text: #EDE8DF;
        --muted: #9E9B95;
        --accent: #E75A2A;
        --border: #2C2E30;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .redirect-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.06);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }
    .logo-dot {
      width: 24px;
      height: 24px;
      background: var(--accent);
      border-radius: 50%;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn-redirect {
      display: inline-block;
      background: var(--accent);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 12px;
      transition: opacity 0.2s;
      width: 100%;
    }
    .btn-redirect:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="logo-badge">
      <div class="logo-dot"></div>
      <span>WRITON</span>
    </div>
    
    <div class="spinner"></div>
    
    <h1>Opening Google Play...</h1>
    <p>Taking you directly to the WritOn app for distraction-free reading and writing.</p>
    
    <a id="direct-link" class="btn-redirect" href="https://play.google.com/store/apps/details?id=com.ibitvalley.writon">
      Open in Google Play Store
    </a>
  </div>

  <script>
    (function () {
      var PLAY_STORE_BASE = "https://play.google.com/store/apps/details?id=com.ibitvalley.writon";
      var UTM_CAMPAIGN = "writon_growth_2026_09";
      var PLATFORMS = {
        ig: "instagram",
        threads: "threads",
        x: "x",
        pin: "pinterest",
        fb: "facebook_group",
        founder: "founder"
      };

      function getDeliveryId() {
        var path = window.location.pathname || "";
        var match = path.match(/\/go\/?([^\/\?#]+)?/i);
        return match && match[1] ? match[1].trim() : "";
      }

      function buildRedirectUrl(deliveryId) {
        if (!deliveryId) return PLAY_STORE_BASE;

        // Parse platform from format: {YYMM}_d{day}_{platform}_{format}_{language}_{creative}
        var parts = deliveryId.split("_");
        var platformKey = (parts.length >= 3) ? parts[2].toLowerCase() : "";
        var platform = PLATFORMS[platformKey] || platformKey || "organic_social";

        var referrer = "utm_source=" + encodeURIComponent(platform) +
                       "&utm_medium=" + encodeURIComponent("organic_social") +
                       "&utm_campaign=" + encodeURIComponent(UTM_CAMPAIGN) +
                       "&utm_content=" + encodeURIComponent(deliveryId);

        return PLAY_STORE_BASE + "&referrer=" + encodeURIComponent(referrer);
      }

      var deliveryId = getDeliveryId();
      var targetUrl = buildRedirectUrl(deliveryId);

      var btn = document.getElementById("direct-link");
      if (btn) btn.href = targetUrl;

      // Execute instant redirect
      try {
        window.location.replace(targetUrl);
      } catch (e) {
        window.location.href = targetUrl;
      }
    })();
  </script>
</body>
</html>
