<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WritOn — Distraction-Free Reading &amp; Writing</title>
  <meta name="description" content="A quiet sanctuary for writers, poets, and avid story readers worldwide. Read deeply, write freely, and discover thoughtful voices." />
  <link rel="canonical" href="https://writon.cc/" />
  <meta name="robots" content="index, follow" />

  <!-- Favicon & Brand Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260913_thicker" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260913_thicker" />
  
  <style>
    :root {
      --bg: #FAF5EE;
      --card-bg: #FFFDF9;
      --text: #2B2621;
      --muted: #6B6257;
      --accent: #E75A2A;
      --accent-hover: #D04E20;
      --border: #E8DFD3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181614;
        --card-bg: #221F1C;
        --text: #F3ECE1;
        --muted: #A89F93;
        --accent: #E75A2A;
        --accent-hover: #F26A3A;
        --border: #35302A;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .portal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 36px rgba(43, 38, 33, 0.08);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 24px;
      letter-spacing: 2px;
      margin-bottom: 20px;
      color: var(--accent);
    }
    .logo-dot {
      width: 22px;
      height: 22px;
      background: var(--accent);
      border-radius: 50%;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 12px;
      color: var(--text);
    }
    p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .btn-primary {
      display: block;
      background: var(--accent);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 24px;
      border-radius: 12px;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .btn-secondary {
      display: block;
      background: transparent;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 13px 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .portal-footer {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: center;
      gap: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .portal-footer a {
      color: var(--muted);
      text-decoration: none;
    }
    .portal-footer a:hover {
      color: var(--accent);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="portal-card">
    <div class="logo-badge">
      <div class="logo-dot"></div>
      <span>WRITON</span>
    </div>
    
    <h1>Words worth remembering.</h1>
    <p>A quiet, distraction-free sanctuary for writers, poets, and story readers. Discover thoughtful literature on web and mobile.</p>
    
    <div class="btn-group">
      <a id="direct-link" class="btn-primary" href="https://play.google.com/store/apps/details?id=com.ibitvalley.writon" target="_blank" rel="noopener noreferrer">
        Get WritOn on Google Play
      </a>
      <a class="btn-secondary" href="/stories">
        Explore Stories &amp; Essays Online
      </a>
    </div>

    <div class="portal-footer">
      <a href="/privacy-policy">Privacy Policy</a>
      <span>•</span>
      <a href="/terms">Terms of Service</a>
      <span>•</span>
      <a href="/">Home</a>
    </div>
  </div>

  <script>
    (function () {
      var PLAY_STORE_BASE = "https://play.google.com/store/apps/details?id=com.ibitvalley.writon";
      var UTM_CAMPAIGN = "writon_growth_2026_09";
      var PLATFORMS = {
        ig: "instagram",
        threads: "threads",
        x: "x",
        pin: "pinterest",
        fb: "facebook_group",
        founder: "founder"
      };

      function getDeliveryId() {
        var path = window.location.pathname || "";
        var match = path.match(/\/go\/?([^\/\?#]+)?/i);
        return match && match[1] ? match[1].trim() : "";
      }

      function buildRedirectUrl(deliveryId) {
        if (!deliveryId) return PLAY_STORE_BASE;

        var parts = deliveryId.split("_");
        var platformKey = (parts.length >= 3) ? parts[2].toLowerCase() : "";
        var platform = PLATFORMS[platformKey] || platformKey || "organic_social";

        var referrer = "utm_source=" + encodeURIComponent(platform) +
                       "&utm_medium=" + encodeURIComponent("organic_social") +
                       "&utm_campaign=" + encodeURIComponent(UTM_CAMPAIGN) +
                       "&utm_content=" + encodeURIComponent(deliveryId);

        return PLAY_STORE_BASE + "&referrer=" + encodeURIComponent(referrer);
      }

      var deliveryId = getDeliveryId();
      var targetUrl = buildRedirectUrl(deliveryId);

      var btn = document.getElementById("direct-link");
      if (btn) btn.href = targetUrl;
    })();
  </script>
</body>
</html>
