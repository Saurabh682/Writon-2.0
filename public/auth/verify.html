<html lang="en">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Email Verification — WritOn</title>
  <meta name="description" content="Verify your WritOn account email address." />
  <link rel="canonical" href="https://writon.cc/auth/verify" />
  <meta name="robots" content="noindex, follow" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260913_thicker" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260913_thicker" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap">

  <!-- Firebase App & Auth SDK (v10 compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg: #FAF5EE;
      --surface: #FFFDF9;
      --ink: #30271F;
      --muted: #6B6257;
      --primary: #9C3E1D;
      --primary-dark: #823317;
      --border: #E8DFD3;
      --accent: #E75A2A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      max-width: 500px;
      width: 100%;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 16px 36px rgba(48, 39, 31, 0.06);
    }
    .brand-mark {
      font-family: Newsreader, Georgia, serif;
      font-size: 28px;
      color: var(--primary);
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }
    .status-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #F4E8DC;
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }
    .status-icon.error {
      background: #FDF2F2;
      color: #9C1A1A;
      border-color: #F8B4B4;
    }
    h1 {
      font-family: Newsreader, Georgia, serif;
      font-size: 32px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 14px;
      line-height: 1.2;
    }
    p {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 28px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: #F4E8DC;
    }
    .footer-note {
      margin-top: 32px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-mark">WritOn</div>
    <div id="status-icon" class="status-icon">⌛</div>
    <h1 id="heading">Verifying Email...</h1>
    <p id="description">Please wait while we confirm your email address.</p>

    <div id="actions" class="actions" style="display:none;">
      <a href="/explore" class="btn btn-primary">Explore Stories</a>
      <a href="https://play.google.com/store/apps/details?id=com.ibitvalley.writon" class="btn btn-secondary" target="_blank" rel="noopener">Get Android App</a>
    </div>

    <div class="footer-note">Words worth remembering.</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDXE2ZKVuYKMcX4Kvl7v7rQmhXZ3JMUcpo",
      authDomain: "writon-app-2020.firebaseapp.com",
      projectId: "writon-app-2020",
      storageBucket: "writon-app-2020.firebasestorage.app"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    const urlParams = new URLSearchParams(window.location.search);
    const actionCode = urlParams.get('oobCode');

    const statusIcon = document.getElementById('status-icon');
    const heading = document.getElementById('heading');
    const description = document.getElementById('description');
    const actions = document.getElementById('actions');

    if (!actionCode) {
      statusIcon.textContent = '✕';
      statusIcon.classList.add('error');
      heading.textContent = 'Verification Code Missing';
      description.textContent = 'This email verification link is missing its action code. Please request a new verification email from the app.';
      actions.style.display = 'flex';
    } else {
      auth.applyActionCode(actionCode)
        .then(() => {
          statusIcon.textContent = '✓';
          heading.textContent = 'Email Confirmed';
          description.textContent = "Your email address has been verified. Welcome to WritOn's sanctuary for slow reading and deliberate writing.";
          actions.style.display = 'flex';
        })
        .catch((err) => {
          console.warn('applyActionCode error:', err);
          statusIcon.textContent = '✕';
          statusIcon.classList.add('error');
          heading.textContent = 'Link Invalid or Expired';
          description.textContent = 'This verification link is invalid, expired, or has already been used. Please sign into the WritOn app to request a new link.';
          actions.style.display = 'flex';
        });
    }
  </script>
</body>
</html>
