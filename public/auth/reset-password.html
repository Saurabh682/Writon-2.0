<html lang="en">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reset Password — WritOn</title>
  <meta name="description" content="Reset your WritOn account password." />
  <link rel="canonical" href="https://writon.cc/auth/reset-password" />
  <meta name="robots" content="noindex, follow" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260913_thicker" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260913_thicker" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap">

  <!-- Firebase App & Auth SDK (v10 compat for drop-in browser scripts) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg: #FAF5EE;
      --surface: #FFFDF9;
      --ink: #30271F;
      --muted: #6B6257;
      --primary: #9C3E1D;
      --primary-dark: #823317;
      --border: #E8DFD3;
      --accent: #E75A2A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      max-width: 500px;
      width: 100%;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 16px 36px rgba(48, 39, 31, 0.06);
    }
    .brand-mark {
      font-family: Newsreader, Georgia, serif;
      font-size: 28px;
      color: var(--primary);
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }
    .key-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #F4E8DC;
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }
    h1 {
      font-family: Newsreader, Georgia, serif;
      font-size: 32px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 14px;
      line-height: 1.2;
    }
    p {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 28px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      font-size: 15px;
      font-family: inherit;
      color: var(--ink);
      outline: none;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(156, 62, 29, 0.12);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      background: var(--primary);
      color: #FFFFFF;
    }
    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .banner {
      display: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: left;
    }
    .banner-error {
      background: #FDF2F2;
      color: #9C1A1A;
      border: 1px solid #F8B4B4;
    }
    .banner-success {
      background: #F4E8DC;
      color: var(--primary);
      border: 1px solid var(--border);
    }
    .footer-note {
      margin-top: 32px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-mark">WritOn</div>
    <div class="key-icon">🔑</div>
    <h1 id="heading">Reset Password</h1>
    <p id="subheading">Verifying your password reset link...</p>

    <div id="error-banner" class="banner banner-error"></div>
    <div id="success-banner" class="banner banner-banner-success banner-success"></div>

    <form id="pw-form" style="display:none;" onsubmit="handlePasswordReset(event)">
      <div class="form-group">
        <label for="new-pw">New Password</label>
        <input type="password" id="new-pw" required minlength="8" placeholder="At least 8 characters" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="confirm-pw">Confirm Password</label>
        <input type="password" id="confirm-pw" required minlength="8" placeholder="Re-enter password" autocomplete="new-password" />
      </div>
      <button type="submit" id="submit-btn" class="btn">Update Password</button>
    </form>

    <div class="footer-note">
      <a href="/" style="color:var(--muted); text-decoration:none;">WritOn Home</a> &middot;
      <a href="/explore" style="color:var(--primary); text-decoration:none;">Explore Stories</a>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDXE2ZKVuYKMcX4Kvl7v7rQmhXZ3JMUcpo",
      authDomain: "writon-app-2020.firebaseapp.com",
      projectId: "writon-app-2020",
      storageBucket: "writon-app-2020.firebasestorage.app"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    const urlParams = new URLSearchParams(window.location.search);
    const actionCode = urlParams.get('oobCode');
    const mode = urlParams.get('mode');

    const errorBanner = document.getElementById('error-banner');
    const successBanner = document.getElementById('success-banner');
    const pwForm = document.getElementById('pw-form');
    const subheading = document.getElementById('subheading');
    const submitBtn = document.getElementById('submit-btn');

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
      successBanner.style.display = 'none';
      pwForm.style.display = 'none';
      subheading.textContent = 'Unable to reset password.';
    }

    if (!actionCode) {
      showError('This password reset link is missing a verification code. Please request a new link from the app.');
    } else {
      auth.verifyPasswordResetCode(actionCode)
        .then((email) => {
          subheading.textContent = `Choose a new, secure password for ${email}.`;
          pwForm.style.display = 'block';
        })
        .catch((err) => {
          console.warn('verifyPasswordResetCode error:', err);
          showError('This password reset link is invalid, expired, or has already been used. Please request a new reset email.');
        });
    }

    async function handlePasswordReset(e) {
      e.preventDefault();
      const pw1 = document.getElementById('new-pw').value;
      const pw2 = document.getElementById('confirm-pw').value;

      if (pw1 !== pw2) {
        errorBanner.textContent = 'Passwords do not match. Please re-enter.';
        errorBanner.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';
      errorBanner.style.display = 'none';

      try {
        await auth.confirmPasswordReset(actionCode, pw1);
        pwForm.style.display = 'none';
        subheading.textContent = 'Your password has been changed.';
        successBanner.innerHTML = '✓ Password updated successfully. You can now sign into WritOn on your mobile device or web.';
        successBanner.style.display = 'block';
      } catch (err) {
        console.error('confirmPasswordReset error:', err);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
        errorBanner.textContent = err.message || 'Failed to update password. The link may have expired.';
        errorBanner.style.display = 'block';
      }
    }
  </script>
</body>
</html>
