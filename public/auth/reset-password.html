<html lang="en">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reset Password — WritOn</title>
  <meta name="description" content="Reset your WritOn account password." />
  <link rel="canonical" href="https://writon.cc/auth/reset-password" />
  <meta name="robots" content="noindex, follow" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260913_thicker" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260913_thicker" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap">

  <style>
    :root {
      --bg: #FAF5EE;
      --surface: #FFFDF9;
      --ink: #30271F;
      --muted: #6B6257;
      --primary: #9C3E1D;
      --primary-dark: #823317;
      --border: #E8DFD3;
      --accent: #E75A2A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      max-width: 500px;
      width: 100%;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 16px 36px rgba(48, 39, 31, 0.06);
    }
    .brand-mark {
      font-family: Newsreader, Georgia, serif;
      font-size: 28px;
      color: var(--primary);
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }
    .key-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #F4E8DC;
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }
    h1 {
      font-family: Newsreader, Georgia, serif;
      font-size: 32px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 14px;
      line-height: 1.2;
    }
    p {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 28px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      font-size: 15px;
      font-family: inherit;
      color: var(--ink);
      outline: none;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(156, 62, 29, 0.12);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      background: var(--primary);
      color: #FFFFFF;
    }
    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }
    .footer-note {
      margin-top: 32px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-mark">WritOn</div>
    <div class="key-icon">🔑</div>
    <h1>Reset Password</h1>
    <p>Choose a new, secure password for your WritOn account.</p>
    <form onsubmit="event.preventDefault(); document.getElementById('msg').style.display='block'; document.getElementById('pw-form').style.display='none';" id="pw-form">
      <div class="form-group">
        <label for="new-pw">New Password</label>
        <input type="password" id="new-pw" required minlength="8" placeholder="At least 8 characters" />
      </div>
      <button type="submit" class="btn">Update Password</button>
    </form>
    <div id="msg" style="display:none; margin-top:20px; color:var(--primary); font-weight:600;">
      Password updated successfully. You can now log into WritOn.
    </div>
    <div class="footer-note">Words worth remembering.</div>
  </div>
</body>
</html>
