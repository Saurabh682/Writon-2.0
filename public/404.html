<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Page Not Found — WritOn</title>
  <meta name="description" content="The page you requested could not be found." />
  <meta name="robots" content="noindex, follow" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260913_thicker" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260913_thicker" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap">

  <style>
    :root {
      --bg: #FAF5EE;
      --surface: #FFFDF9;
      --ink: #30271F;
      --muted: #6B6257;
      --primary: #9C3E1D;
      --primary-dark: #823317;
      --border: #E8DFD3;
      --accent: #E75A2A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      max-width: 500px;
      width: 100%;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 16px 36px rgba(48, 39, 31, 0.06);
    }
    .brand-mark {
      font-family: Newsreader, Georgia, serif;
      font-size: 28px;
      color: var(--primary);
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }
    .error-code {
      font-family: Newsreader, Georgia, serif;
      font-size: 54px;
      font-weight: normal;
      color: var(--primary);
      margin-bottom: 8px;
      line-height: 1;
    }
    h1 {
      font-family: Newsreader, Georgia, serif;
      font-size: 26px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 14px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: #F4E8DC;
    }
    .footer-note {
      margin-top: 32px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-mark">WritOn</div>
    <div class="error-code">404</div>
    <h1>Quiet Page</h1>
    <p>The page you are looking for does not exist or has moved. Return to the sanctuary to continue reading.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Return to Home</a>
      <a href="/#explore" class="btn btn-secondary">Explore Stories</a>
    </div>
    <div class="footer-note">Words worth remembering.</div>
  </div>
</body>
</html>
