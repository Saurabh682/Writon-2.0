  <link rel="stylesheet" href="/stories/share.css" />

  <!-- Schema.org FAQPage Structured Data for Generative AI & Google Search Rich Snippets -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is WritOn?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "WritOn is an independent storytelling and publishing platform designed for thinkers, essayists, poets, and discerning readers who value craftsmanship, intentional writing, and distraction-free literature."
        }
      },
      {
        "@type": "Question",
        "name": "Can I read stories and essays offline on WritOn?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. The WritOn Android mobile application provides native offline reading, allowing users to save stories, essays, and poetry to their offline library for uninterrupted reading anywhere."
        }
      },
      {
        "@type": "Question",
        "name": "How do authors publish on WritOn?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Authors compose stories using WritOn’s distraction-free editor with markdown support, publishing directly to categorized discovery feeds and reaching a global literary community."
        }
      },
      {
        "@type": "Question",
        "name": "Is WritOn free to read?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes, WritOn is completely free to read on the web and available as a free download on Google Play, providing open access to independent essays, poetry, and stories without paywalls."
        }
      }
    ]
  }
  </script>
</head>
<body>
  <main>
    <div id="loading" class="loading-box" data-nosnippet>
      <p>Loading story...</p>
    </div>

    <article id="story-article" style="display:none;">
      <header class="story-header" data-nosnippet>
        <a href="/" class="brand-badge">
          <span>✒ WritOn</span>
        </a>
        <h1 id="story-title"></h1>
        <div class="story-meta-row">
          <div id="author-avatar-wrap"></div>
          <div>
            <div id="author-name" class="author-name"></div>
            <div id="reading-meta" class="reading-meta"></div>
          </div>
        </div>
      </header>

      <div id="cover-wrap"></div>

      <div id="story-content" class="story-content"></div>

      <div class="app-cta-card" data-nosnippet>
        <h3>Continue Reading in WritOn</h3>
        <p>Enjoy distraction-free reading, offline library access, and join the writer discussion.</p>
        <div class="cta-buttons">
          <a id="btn-app-intent" class="btn-open" href="#">Open in App</a>
          <a class="btn-store" href="https://play.google.com/store/apps/details?id=com.ibitvalley.writon" target="_blank">Get WritOn Free</a>
        </div>
      </div>
    </article>
  </main>

  <script>
    const API_BASE = "https://api.writon.cc";
    const FALLBACK_API_BASE = "https://writon-powerup.onrender.com";
    const urlParams = new URLSearchParams(window.location.search);
    const storyReferrer = `utm_source=${encodeURIComponent(urlParams.get('utm_source') || 'website')}&utm_medium=${encodeURIComponent(urlParams.get('utm_medium') || 'story_reader')}&utm_campaign=writon_growth_2026_09&utm_content=${encodeURIComponent(window.location.pathname.split('/').filter(Boolean).pop() || 'story')}`;
    const PLAY_STORE_URL = `https://play.google.com/store/apps/details?id=com.ibitvalley.writon&referrer=${encodeURIComponent(storyReferrer)}`;

    document.querySelectorAll('.btn-store, a[href*="play.google.com"]').forEach(el => el.href = PLAY_STORE_URL);

    function formatMarkdownToHtml(raw) {
      if (!raw) return '';
      // Strip watermarks
      let text = raw
        .replace(/<!--\s*#writon\s*watermark\s*-->/gi, '')
        .replace(/<span\b[^>]*class=["']writon-watermark["'][^>]*>[\s\S]*?<\/span>/gi, '')
        .replace(/^###\s+[^\n]+\n+/i, '')
        .replace(/^\*[Bb]y\s+[^\n*]+\*\n+/i, '')
        .trim();

      // Escape HTML
      text = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

      // Markdown formatting
      text = text
        .replace(/^#### (.*$)/gim, '<h4>$1</h4>')
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/^(?:---|___|\*\*\*)$/gim, '<hr class="story-divider">')
        .replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/_(.*?)_/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\[(.*?)\]\((https?:\/\/[^\s\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

      const chunks = text.split(/\n\n+/).filter(Boolean);

      return chunks.map(chunk => {
        const trimmed = chunk.trim();
        if (!trimmed) return '';
        if (trimmed.startsWith('<h') || trimmed.startsWith('<hr')) return trimmed;

        // Hashtags
        if (/^#[a-zA-Z0-9_]+(?:\s+#[a-zA-Z0-9_]+)*$/.test(trimmed)) {
          const tags = trimmed.split(/\s+/).map(t => `<span class="hashtag">${t}</span>`).join(' ');
          return `<div class="story-hashtags">${tags}</div>`;
        }

        const lines = trimmed.split(/\n/);

        // Blockquotes
        if (lines.every(l => /^(?:&gt;|>)/.test(l.trim()))) {
          const quoteContent = lines.map(l => l.trim().replace(/^(?:&gt;|>)\s*/, '')).join('<br>');
          return `<blockquote><p>${quoteContent}</p></blockquote>`;
        }

        // Numbered Lists (1. , 2. )
        if (lines.every(l => /^\d+\.\s+/.test(l.trim()))) {
          const items = lines.map(l => `<li>${l.trim().replace(/^\d+\.\s+/, '')}</li>`).join('');
          return `<ol>${items}</ol>`;
        }

        // Unordered Lists (- , * , • )
        if (lines.every(l => /^(?:[-*•]|&bull;)\s+/.test(l.trim()))) {
          const items = lines.map(l => `<li>${l.trim().replace(/^(?:[-*•]|&bull;)\s+/, '')}</li>`).join('');
          return `<ul>${items}</ul>`;
        }

        return `<p>${trimmed.replace(/\n/g, '<br>')}</p>`;
      }).filter(Boolean).join('\n');
    }

    async function loadStory() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts[pathParts.length - 1];

      if (!slug || slug === 'stories') {
        window.location.href = '/#explore';
        return;
      }

      try {
        let res = await fetch(`${API_BASE}/api/v1/posts/${encodeURIComponent(slug)}`).catch(() => null);
        if (!res || !res.ok) {
          res = await fetch(`${FALLBACK_API_BASE}/api/v1/posts/${encodeURIComponent(slug)}`);
        }
        if (!res.ok) throw new Error("Story not found");
        const data = await res.json();
        const post = data.post || data;
        const story = post;
        document.documentElement.lang = story.language || 'en';

        const OG_LOCALES = { en: 'en_US', hi: 'hi_IN', mr: 'mr_IN', bn: 'bn_IN', es: 'es_ES', fr: 'fr_FR' };
        const storyLang = String(story.language || 'en').trim().toLowerCase().split(/[-_]/)[0];
        const ogLocale = OG_LOCALES[storyLang] || 'en_US';
        const ogLocaleEl = document.getElementById('og-locale');
        if (ogLocaleEl) {
          ogLocaleEl.setAttribute('content', ogLocale);
        }

        const authorName = post.author?.fullName || post.author?.penName || post.authorName || 'WritOn Author';
        const authorAvatarUrl = post.author?.avatarUrl || post.authorAvatarUrl;
        const readingTime = post.readingTimeMin || post.readingTimeMinutes || 3;
        const coverImg = post.coverImage || post.coverImageUrl;

        const storyUrl = `https://writon.cc/stories/${slug}`;
        document.getElementById('canonical-link').href = storyUrl;
        document.getElementById('page-title').textContent = `${post.title} — WritOn`;
        document.getElementById('story-title').textContent = post.title;
        document.getElementById('author-name').textContent = authorName;
        document.getElementById('reading-meta').textContent = `${post.category || 'Literature'} • ${readingTime} min read`;
        if (post.summary) {
          document.getElementById('meta-desc').setAttribute('content', post.summary);
          document.getElementById('og-desc').setAttribute('content', post.summary);
        }
        document.getElementById('og-title').setAttribute('content', `${post.title} — WritOn`);
        if (coverImg) {
          document.getElementById('og-img').setAttribute('content', coverImg);
        }

        const twTitle = document.getElementById('twitter-title');
        if (twTitle) twTitle.setAttribute('content', `${post.title} — WritOn`);
        const twDesc = document.getElementById('twitter-desc');
        if (twDesc && post.summary) twDesc.setAttribute('content', post.summary);
        const twImg = document.getElementById('twitter-img');
        if (twImg && coverImg) twImg.setAttribute('content', coverImg);

        // Schema.org Structured Data (BlogPosting + BreadcrumbList) for Google Search Rich Results
        try {
          const breadcrumbLd = {
            "@type": "BreadcrumbList",
            "itemListElement": [
              { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://writon.cc/" },
              { "@type": "ListItem", "position": 2, "name": post.category || "Stories", "item": `https://writon.cc/stories?category=${encodeURIComponent(post.category || 'Stories')}` },
              { "@type": "ListItem", "position": 3, "name": post.title, "item": storyUrl }
            ]
          };

          const blogPostingLd = {
            "@type": "BlogPosting",
            "mainEntityOfPage": { "@type": "WebPage", "@id": storyUrl },
            "headline": post.title,
            "description": post.summary || post.title,
            "image": coverImg ? [coverImg] : ["https://writon.cc/assets/hero-banner.webp"],
            "datePublished": post.createdAt ? new Date(post.createdAt).toISOString() : new Date().toISOString(),
            "dateModified": post.updatedAt ? new Date(post.updatedAt).toISOString() : (post.createdAt ? new Date(post.createdAt).toISOString() : new Date().toISOString()),
            "author": {
              "@type": "Person",
              "name": authorName,
              "url": `https://writon.cc/stories?author=${encodeURIComponent(post.author?.penName || authorName)}`
            },
            "publisher": {
              "@type": "Organization",
              "name": "WritOn",
              "url": "https://writon.cc",
              "logo": {
                "@type": "ImageObject",
                "url": "https://writon.cc/assets/writon_app_icon.png"
              },
              "sameAs": [
                "https://play.google.com/store/apps/details?id=com.ibitvalley.writon",
                "https://github.com/Saurabh682/WritOn-PowerUp"
              ]
            },
            "articleSection": post.category || "Literature"
          };

          let jsonLdScript = document.getElementById('story-jsonld');
          if (!jsonLdScript) {
            jsonLdScript = document.createElement('script');
            jsonLdScript.id = 'story-jsonld';
            jsonLdScript.type = 'application/ld+json';
            document.head.appendChild(jsonLdScript);
          }
          jsonLdScript.textContent = JSON.stringify({
            "@context": "https://schema.org",
            "@graph": [breadcrumbLd, blogPostingLd]
          });
        } catch (schemaErr) {
          console.warn('Could not inject JSON-LD schema:', schemaErr);
        }

        // Avatar
        const avatarWrap = document.getElementById('author-avatar-wrap');
        if (authorAvatarUrl) {
          avatarWrap.innerHTML = `<img class="author-avatar" src="${authorAvatarUrl}" alt="Portrait of ${authorName}" loading="lazy" decoding="async">`;
          avatarWrap.querySelector('img').addEventListener('error', () => {
            avatarWrap.innerHTML = `<div class="author-avatar-fallback">${initial}</div>`;
          }, { once: true });
        } else {
          const initial = (authorName || 'W')[0].toUpperCase();
          avatarWrap.innerHTML = `<div class="author-avatar-fallback">${initial}</div>`;
        }

        // Cover
        if (coverImg) {
          document.getElementById('cover-wrap').innerHTML = `<img class="cover-img" src="${coverImg}" alt="Cover artwork for ${post.title}" loading="lazy" decoding="async">`;
        }

        // Rich Formatted Content
        const contentDiv = document.getElementById('story-content');
        contentDiv.innerHTML = formatMarkdownToHtml(post.content || post.summary || '');

        // App Intent
        const intentUrl = `intent://writon.cc/stories/${slug}#Intent;scheme=https;package=com.ibitvalley.writon;S.browser_fallback_url=${encodeURIComponent(PLAY_STORE_URL)};end`;
        document.getElementById('btn-app-intent').href = intentUrl;

        document.getElementById('loading').style.display = 'none';
        document.getElementById('story-article').style.display = 'block';

      } catch (err) {
        document.getElementById('loading').innerHTML = `
          <h2>Story Not Found</h2>
          <p style="margin: 16px 0;">This story may have been moved or removed.</p>
          <a href="/" style="color: #B5442A; font-weight: 600; text-decoration: none;">← Back to WritOn Home</a>
        `;
      }
    }

    loadStory();
  </script>
</body>
</html>
