services:
  - type: web
    name: writon-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_POOL_MAX
        value: "10"
      # Bot automation is owned by the dedicated Google Cloud Run service.
      # Keep Render focused on the public application API to avoid duplicate pulses.
      - key: SPARK_AUTOMATION_ENABLED
        value: "false"
      - key: PUBLIC_API_BASE_URL
        value: "https://writon-powerup.onrender.com"
      - key: LATEST_APP_VERSION_CODE
        value: "110"
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ORIGINS
        sync: false
