services:
  - type: web
    name: writon-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_POOL_MAX
        value: "10"
      # Bot automation and scheduled workers are owned by Google Cloud Run.
      # Keep Render focused exclusively on standby application serving to avoid duplicate notifications.
      - key: SPARK_AUTOMATION_ENABLED
        value: "false"
      - key: PUSH_DELIVERY_ENABLED
        value: "false"
      - key: DAILY_DIGEST_ENABLED
        value: "false"
      - key: FOLLOWED_WRITER_NOTIFICATIONS_ENABLED
        value: "false"
      - key: TIMERS_DISABLED
        value: "true"
      - key: PUBLIC_API_BASE_URL
        value: "https://api.writon.cc"
      - key: LATEST_APP_VERSION_CODE
        value: "119"
      # Advance only after Google Play confirms that the build is available.
      - key: PUBLISHED_APP_VERSION_CODE
        value: "108"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ORIGINS
        sync: false
