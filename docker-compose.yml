services:
  writon-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: writon-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL through your deployment secret store.}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS to your web application's HTTPS origin.}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON:?Set FIREBASE_SERVICE_ACCOUNT_JSON through your deployment secret store.}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  writon-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: writon-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - writon-backend
