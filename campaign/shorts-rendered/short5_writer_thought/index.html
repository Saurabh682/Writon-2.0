<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>WritOn — Maybe Closure is Memory Running Out of Questions #shorts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&family=Noto+Serif+Devanagari:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #FAF5EE;
        font-family: 'Newsreader', 'Noto Serif Devanagari', Georgia, serif;
        color: #261F1C;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: radial-gradient(circle at 15% 15%, rgba(231, 90, 42, 0.08) 0%, transparent 45%),
                    radial-gradient(circle at 85% 85%, rgba(212, 82, 38, 0.06) 0%, transparent 50%),
                    #FAF5EE;
        overflow: hidden;
      }
      .paper-texture {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(#d3c6b4 0.75px, transparent 0.75px);
        background-size: 24px 24px;
        opacity: 0.25;
        pointer-events: none;
      }
      .bloom-top-left {
        position: absolute;
        top: -100px;
        left: -100px;
        width: 450px;
        height: 450px;
        background: radial-gradient(circle, rgba(231, 90, 42, 0.18) 0%, rgba(245, 237, 226, 0.05) 60%, transparent 75%);
        filter: blur(40px);
        border-radius: 50%;
      }
      .bloom-bottom-right {
        position: absolute;
        bottom: -120px;
        right: -120px;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(186, 78, 40, 0.15) 0%, rgba(245, 237, 226, 0.05) 65%, transparent 75%);
        filter: blur(45px);
        border-radius: 50%;
      }
      .watermark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        user-select: none;
        opacity: 0.10;
      }

      /* Central Parchment Frame - Frame Zero baked in */
      .card-frame {
        position: absolute;
        top: 140px;
        left: 80px;
        width: 920px;
        height: 1640px;
        border: 1px solid rgba(230, 215, 200, 0.85);
        border-radius: 32px;
        padding: 80px 70px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: rgba(255, 253, 249, 0.88);
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 60px rgba(84, 58, 38, 0.06);
      }
      .inner-dashed {
        position: absolute;
        inset: 16px;
        border: 1px dashed rgba(223, 205, 189, 0.7);
        border-radius: 20px;
        pointer-events: none;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 2;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        padding: 10px 24px;
        background: rgba(186, 78, 40, 0.12);
        color: #A33F1D;
        border-radius: 999px;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .brand {
        font-size: 38px;
        font-weight: 600;
        letter-spacing: -0.5px;
        color: #261F1C;
      }
      .brand span {
        color: #E75A2A;
      }
      .content {
        z-index: 2;
        margin: auto 0;
      }
      .quote-mark {
        font-size: 96px;
        line-height: 1;
        color: #BA4E28;
        opacity: 0.85;
        margin-bottom: 20px;
        font-style: italic;
      }
      .headline {
        font-size: 60px;
        line-height: 1.3;
        font-weight: 400;
        color: #261F1C;
        margin-bottom: 35px;
        letter-spacing: -0.5px;
      }
      .headline em {
        font-style: italic;
        color: #BA4E28;
      }
      .divider {
        width: 80px;
        height: 2px;
        background-color: #BA4E28;
        opacity: 0.4;
        margin: 30px 0;
      }
      .subtext {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 27px;
        line-height: 1.55;
        color: #685D56;
        max-width: 740px;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        z-index: 2;
      }
      .handle {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 22px;
        color: #756860;
        letter-spacing: 1px;
      }
      .cta {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 22px;
        color: #BA4E28;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1080"
      data-height="1920"
    >
      <div class="paper-texture"></div>
      <div class="bloom-top-left" id="bloomLeft"></div>
      <div class="bloom-bottom-right" id="bloomRight"></div>
      <audio id="ambientMusic" src="assets/official_writon_piano.mp3" data-start="0" data-duration="8"></audio>

      <!-- Watermark W -->
      <svg class="watermark" width="580" height="580" viewBox="0 0 200 200" data-layout-allow-overlap data-layout-allow-occlusion>
        <text x="100" y="150" font-family="'Newsreader', Georgia, serif" font-size="190" font-style="italic" fill="#D8CEBF" text-anchor="middle">W</text>
      </svg>

      <!-- Frame Zero: Clean visible card immediately at Second 0 -->
      <div class="card-frame" id="card" data-start="0" data-duration="8">
        <div class="inner-dashed"></div>

        <div class="header">
          <div class="pill" id="pill">WRITER THOUGHT</div>
          <div class="brand" id="brand">WritOn<span>.</span></div>
        </div>

        <div class="content">
          <div class="quote-mark" id="quoteMark">“</div>
          <h1 class="headline" id="headline">
            Maybe closure is just <em>memory</em> running out of questions.
          </h1>
          <div class="divider" id="divider"></div>
          <p class="subtext" id="subtext">
            The draft in your notes app at 2:00 AM wasn’t a mistake. It was the only honest sentence you wrote all week.
          </p>
        </div>

        <div class="footer">
          <div class="handle" id="handle">@writon_app</div>
          <div class="cta" id="cta">writon.cc ↗</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Frame Zero is already rendered & legible. Subtle organic breath:
      tl.fromTo("#bloomLeft", { scale: 0.8, opacity: 0.4 }, { scale: 1.05, opacity: 0.9, duration: 4.0, ease: "sine.inOut" }, 0)
        .fromTo("#bloomRight", { scale: 0.8, opacity: 0.4 }, { scale: 1.05, opacity: 0.9, duration: 4.0, ease: "sine.inOut" }, 0.5)
        .fromTo("#headline", { opacity: 0.85, y: 5 }, { opacity: 1, y: 0, duration: 1.5, ease: "power2.out" }, 0)
        .fromTo("#divider", { scaleX: 0.4, transformOrigin: "left center" }, { scaleX: 1, duration: 1.5, ease: "power2.out" }, 0.3)
        .fromTo("#subtext", { opacity: 0.6, y: 8 }, { opacity: 1, y: 0, duration: 2.0, ease: "power2.out" }, 0.8)
        .to("#card", { y: -6, duration: 3.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
