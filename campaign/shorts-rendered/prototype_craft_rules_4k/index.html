<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=3840" />
    <title>WritOn — Stop Writing He Was Happy #shorts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 2160px;
        height: 3840px;
        overflow: hidden;
        background-color: #FAF5EE;
        font-family: 'Newsreader', Georgia, serif;
        color: #261F1C;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 2160px;
        height: 3840px;
        background: radial-gradient(circle at 15% 15%, rgba(231, 90, 42, 0.09) 0%, transparent 45%),
                    radial-gradient(circle at 85% 85%, rgba(212, 82, 38, 0.07) 0%, transparent 50%),
                    #FAF5EE;
        overflow: hidden;
      }
      .paper-texture {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(#d3c6b4 0.150px, transparent 0.150px);
        background-size: 48px 48px;
        opacity: 0.25;
        pointer-events: none;
      }
      .bloom-top-left {
        position: absolute;
        top: -200px;
        left: -200px;
        width: 900px;
        height: 900px;
        background: radial-gradient(circle, rgba(231, 90, 42, 0.18) 0%, rgba(245, 237, 226, 0.05) 60%, transparent 75%);
        filter: blur(80px);
        border-radius: 50%;
      }
      .bloom-bottom-right {
        position: absolute;
        bottom: -240px;
        right: -240px;
        width: 1000px;
        height: 1000px;
        background: radial-gradient(circle, rgba(186, 78, 40, 0.15) 0%, rgba(245, 237, 226, 0.05) 65%, transparent 75%);
        filter: blur(90px);
        border-radius: 50%;
      }
      .watermark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        user-select: none;
        opacity: 0.10;
      }

      /* Central Parchment Frame */
      .card-frame {
        position: absolute;
        top: 280px;
        left: 160px;
        width: 1840px;
        height: 3280px;
        border: 2px solid rgba(230, 215, 200, 0.85);
        border-radius: 64px;
        padding: 160px 140px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: rgba(255, 253, 249, 0.90);
        backdrop-filter: blur(20px);
        box-shadow: 0 40px 120px rgba(84, 58, 38, 0.06);
      }
      .inner-dashed {
        position: absolute;
        inset: 32px;
        border: 2px dashed rgba(223, 205, 189, 0.7);
        border-radius: 40px;
        pointer-events: none;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 16px 36px;
        border-radius: 9999px;
        background: rgba(231, 90, 42, 0.10);
        color: #BA4E28;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 32px;
        font-weight: 600;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      .brand {
        font-family: 'Newsreader', Georgia, serif;
        font-size: 56px;
        font-style: italic;
        color: #8C7D70;
      }
      .brand span {
        color: #BA4E28;
      }

      .content {
        margin: auto 0;
        display: flex;
        flex-direction: column;
        gap: 56px;
      }
      .quote-mark {
        font-family: 'Newsreader', Georgia, serif;
        font-size: 160px;
        line-height: 0.8;
        color: #BA4E28;
        opacity: 0.35;
      }
      .headline {
        font-family: 'Newsreader', Georgia, serif;
        font-size: 88px;
        line-height: 1.18;
        font-weight: 600;
        color: #1A1A1A;
        letter-spacing: -1.5px;
      }
      .headline .strikethrough {
        color: #A3968A;
        text-decoration: line-through;
        text-decoration-color: #BA4E28;
        text-decoration-thickness: 6px;
      }
      .headline em {
        font-style: italic;
        color: #BA4E28;
      }

      .divider {
        width: 140px;
        height: 4px;
        background-color: #BA4E28;
        opacity: 0.8;
      }
      .subtext {
        font-family: 'Newsreader', Georgia, serif;
        font-size: 64px;
        line-height: 1.42;
        color: #3D3531;
        font-style: italic;
      }
      .subtext strong {
        font-style: normal;
        font-weight: 600;
        color: #1A1A1A;
      }

      /* Animated Word Spans */
      .word, .subword {
        display: inline-block;
        opacity: 0;
        transform: translateY(8px);
      }

      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 2px solid rgba(230, 215, 200, 0.6);
        padding-top: 56px;
      }
      .handle {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 44px;
        color: #756860;
        letter-spacing: 2px;
      }
      .cta {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 44px;
        color: #BA4E28;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="14"
      data-width="2160"
      data-height="3840"
    >
      <div class="paper-texture"></div>
      <div class="bloom-top-left" id="bloomLeft"></div>
      <div class="bloom-bottom-right" id="bloomRight"></div>
      <audio id="voiceTrack" src="assets/voiceover_mixed.mp3" data-start="0" data-duration="14"></audio>

      <!-- Watermark W -->
      <svg class="watermark" width="1160" height="1160" viewBox="0 0 400 400" data-layout-allow-overlap data-layout-allow-occlusion>
        <text x="200" y="300" font-family="'Newsreader', Georgia, serif" font-size="380" font-style="italic" fill="#D8CEBF" text-anchor="middle">W</text>
      </svg>

      <!-- Central Parchment Frame -->
      <div class="card-frame" id="card" data-start="0" data-duration="14">
        <div class="inner-dashed"></div>

        <div class="header">
          <div class="pill" id="pill">CRAFT RULE</div>
          <div class="brand" id="brand">WritOn<span>.</span></div>
        </div>

        <div class="content">
          <div class="quote-mark" id="quoteMark">“</div>
          <h1 class="headline" id="headline">
            <span class="word">Never</span> <span class="word">write:</span> <span class="word strikethrough">“He</span> <span class="word strikethrough">was</span> <span class="word strikethrough">happy.”</span><br/>
            <span class="word">Give</span> <span class="word">the</span> <span class="word">reader</span> <span class="word">one</span> <span class="word">physical</span> <span class="word"><em>action</em></span> <span class="word">they</span> <span class="word">can</span> <span class="word">actually</span> <span class="word">see.</span>
          </h1>
          <div class="divider" id="divider"></div>
          <p class="subtext" id="subtext">
            <span class="subword">If</span> <span class="subword">she</span> <span class="subword">is</span> <span class="subword">nervous,</span> <span class="subword">let</span> <span class="subword">her</span> <span class="subword">fold</span> <span class="subword">the</span> <span class="subword">receipt</span> <span class="subword">until</span> <span class="subword">it</span> <span class="subword">splits.</span><br/><br/>
            <span class="subword"><strong>The</strong></span> <span class="subword"><strong>moment</strong></span> <span class="subword"><strong>you</strong></span> <span class="subword"><strong>name</strong></span> <span class="subword"><strong>the</strong></span> <span class="subword"><strong>emotion,</strong></span> <span class="subword">the</span> <span class="subword">reader</span> <span class="subword">stops</span> <span class="subword">feeling</span> <span class="subword">it.</span>
          </p>
        </div>

        <div class="footer">
          <div class="handle" id="handle">@writon_app</div>
          <div class="cta" id="cta">writon.cc ↗</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Subtle background watercolor pulse
      tl.fromTo("#bloomLeft", { scale: 0.8, opacity: 0.4 }, { scale: 1.15, opacity: 0.85, duration: 7.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0)
        .fromTo("#bloomRight", { scale: 0.8, opacity: 0.4 }, { scale: 1.15, opacity: 0.85, duration: 7.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.5);

      // Headline words sync with voiceover (0.0s to 5.0s)
      const headlineWords = document.querySelectorAll("#headline .word");
      tl.to(headlineWords, {
        opacity: 1,
        y: 0,
        duration: 0.22,
        stagger: 0.32,
        ease: "power2.out"
      }, 0.2);

      // Divider reveal
      tl.fromTo("#divider", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, 5.2);

      // Subtext words sync with voiceover (5.5s to 13.5s)
      const subwords = document.querySelectorAll("#subtext .subword");
      tl.to(subwords, {
        opacity: 1,
        y: 0,
        duration: 0.20,
        stagger: 0.34,
        ease: "power2.out"
      }, 5.5);

      // Gentle card drift
      tl.to("#card", { y: -10, duration: 6.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
