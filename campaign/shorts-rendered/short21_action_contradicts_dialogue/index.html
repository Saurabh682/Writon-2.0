<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>WritOn — Let the action contradict the dialogue</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #FAF5EE;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #FAF5EE;
      }

      /* Each frame layer occupies full 1080x1920 with high visual sharpness */
      .frame-layer {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        visibility: hidden;
      }

      #frame1 {
        background-image: url('assets/1.png');
        visibility: visible;
        z-index: 10;
      }
      #frame2 {
        background-image: url('assets/2.png');
        z-index: 20;
      }
      #frame3 {
        background-image: url('assets/3.png');
        z-index: 30;
      }
      #frame4 {
        background-image: url('assets/4.png');
        z-index: 40;
      }
      #frame5 {
        background-image: url('assets/5.png');
        z-index: 50;
      }
      #frame6 {
        background-image: url('assets/6.png');
        z-index: 60;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-fps="30"
      data-duration="14.0"
      data-width="1080"
      data-height="1920"
    >
      <div id="frame1" class="frame-layer"></div>
      <div id="frame2" class="frame-layer"></div>
      <div id="frame3" class="frame-layer"></div>
      <div id="frame4" class="frame-layer"></div>
      <div id="frame5" class="frame-layer"></div>
      <div id="frame6" class="frame-layer"></div>
    </div>

    <script>
      // Exact frame cuts without blank transitions:
      // Frame 1: 0.00s - 2.00s ("Do you believe her?")
      // Frame 2: 2.00s - 4.25s ("'I'm fine,' she exclaimed defensively.")
      // Frame 3: 4.25s - 6.25s ("'I'm fine.' She wiped again.")
      // Frame 4: 6.25s - 8.25s ("Let actions contradict words.")
      // Frame 5: 8.25s - 10.00s ("'Take your time.'")
      // Frame 6: 10.00s - 14.00s ("He checked his watch again. Subscribe for daily craft fixes.")
      // Subscription badge on Frame 6 is held visible for the final 4 seconds (10s - 14s).

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Frame 1 (0.00s -> 2.00s)
      tl.set("#frame1", { visibility: "visible" }, 0);

      // Frame 2 Cut (2.00s)
      tl.set("#frame1", { visibility: "hidden" }, 2.00)
        .set("#frame2", { visibility: "visible" }, 2.00);

      // Frame 3 Cut (4.25s)
      tl.set("#frame2", { visibility: "hidden" }, 4.25)
        .set("#frame3", { visibility: "visible" }, 4.25);

      // Frame 4 Cut (6.25s)
      tl.set("#frame3", { visibility: "hidden" }, 6.25)
        .set("#frame4", { visibility: "visible" }, 6.25);

      // Frame 5 Cut (8.25s)
      tl.set("#frame4", { visibility: "hidden" }, 8.25)
        .set("#frame5", { visibility: "visible" }, 8.25);

      // Frame 6 Cut (10.00s -> 14.00s)
      tl.set("#frame5", { visibility: "hidden" }, 10.00)
        .set("#frame6", { visibility: "visible" }, 10.00);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
